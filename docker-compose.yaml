# =====================================================================
# Banco XYZ - Orquestacion completa (Exp3-S8)
#
#   - kafka        : broker de eventos (modo KRaft, sin Zookeeper)
#   - kafka-ui     : consola web para inspeccionar topicos y mensajes
#   - auth-server  : servidor de autorizacion OAuth 2.0
#   - bff-web      : BFF canal Web        (HTTPS 8443)
#   - bff-mobile   : BFF canal Movil      (HTTPS 8444)
#   - bff-atm      : BFF canal Cajeros    (HTTPS 8445) - productor de eventos
#   - notificaciones-service : consumidor de eventos (8090)
#
# =====================================================================

services:

  # -------------------------------------------------------------------
  # Broker de eventos
  # -------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: banco-kafka
    ports:
      - "29092:29092"          # acceso desde el host (pruebas locales)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [banco-net]

  # Consola web de Kafka: permite ver el topico banco.retiros y sus mensajes
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banco-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: banco-xyz
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [banco-net]

  # -------------------------------------------------------------------
  # Servidor de autorizacion OAuth 2.0
  # -------------------------------------------------------------------
  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: bancoxyz/auth-server:1.0.0
    container_name: banco-auth-server
    ports:
      - "9000:9000"
    environment:
      # El issuer debe ser alcanzable con la MISMA URL desde el host y
      # desde los contenedores, por eso se usa el nombre del servicio.
      AUTH_ISSUER: http://auth-server:9000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/oauth2/jwks || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [banco-net]

  # -------------------------------------------------------------------
  # BFF canal Web
  # -------------------------------------------------------------------
  bff-web:
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    image: bancoxyz/bff-web:1.0.0
    container_name: banco-bff-web
    ports:
      - "8443:8443"
    environment:
      SPRING_PROFILES_ACTIVE: ${DB_PROFILE:-oracle}
      AUTH_ISSUER: http://auth-server:9000
      AUTH_JWKS: http://auth-server:9000/oauth2/jwks
      TNS_ALIAS: ${TNS_ALIAS:-bancoxyz_high}
      TNS_ADMIN: /wallet
      DB_USER: ${DB_USER:-ADMIN}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${WALLET_PATH:-./wallet}:/wallet:ro   # Wallet de Oracle Cloud (solo lectura)
    depends_on:
      auth-server:
        condition: service_healthy
    restart: on-failure                        # resiliencia: reinicio automatico
    networks: [banco-net]

  # -------------------------------------------------------------------
  # BFF canal Movil
  # -------------------------------------------------------------------
  bff-mobile:
    build:
      context: .
      dockerfile: bff-mobile/Dockerfile
    image: bancoxyz/bff-mobile:1.0.0
    container_name: banco-bff-mobile
    ports:
      - "8444:8444"
    environment:
      SPRING_PROFILES_ACTIVE: ${DB_PROFILE:-oracle}
      AUTH_ISSUER: http://auth-server:9000
      AUTH_JWKS: http://auth-server:9000/oauth2/jwks
      TNS_ALIAS: ${TNS_ALIAS:-bancoxyz_high}
      TNS_ADMIN: /wallet
      DB_USER: ${DB_USER:-ADMIN}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${WALLET_PATH:-./wallet}:/wallet:ro
    depends_on:
      auth-server:
        condition: service_healthy
    restart: on-failure
    networks: [banco-net]

  # -------------------------------------------------------------------
  # BFF canal Cajeros (productor de eventos)
  # -------------------------------------------------------------------
  bff-atm:
    build:
      context: .
      dockerfile: bff-atm/Dockerfile
    image: bancoxyz/bff-atm:1.0.0
    container_name: banco-bff-atm
    ports:
      - "8445:8445"
    environment:
      SPRING_PROFILES_ACTIVE: ${DB_PROFILE:-oracle}
      AUTH_ISSUER: http://auth-server:9000
      AUTH_JWKS: http://auth-server:9000/oauth2/jwks
      KAFKA_BOOTSTRAP: kafka:9092
      TNS_ALIAS: ${TNS_ALIAS:-bancoxyz_high}
      TNS_ADMIN: /wallet
      DB_USER: ${DB_USER:-ADMIN}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${WALLET_PATH:-./wallet}:/wallet:ro
    depends_on:
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure
    networks: [banco-net]

  # -------------------------------------------------------------------
  # Consumidor de eventos: notificaciones y antifraude
  # -------------------------------------------------------------------
  notificaciones-service:
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
    image: bancoxyz/notificaciones-service:1.0.0
    container_name: banco-notificaciones
    ports:
      - "8090:8090"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks: [banco-net]

networks:
  banco-net:
    driver: bridge
    name: banco-xyz-net
